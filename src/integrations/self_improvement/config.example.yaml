# The "Self Improvement" integration: Keep analysing and changing its own code through the
# Claude Code CLI on the server machine — self_analysis, improve_integration (a PR confined to one
# integration, or a new one), report_issue (a GitHub issue for the developers), self_improvement
# (a PR on any part of the code, developer installs only: the root key is_developer) and the
# nightly code-quality runs. Enable with `enabled_integrations: [Self Improvement]`.
# The setup is on the server machine itself, by hand:
#   1. Install Claude Code: `curl -fsSL https://claude.ai/install.sh | bash` (puts `claude` in
#      ~/.local/bin, which the server also looks in when it is not on the PATH). Nothing else is
#      needed when api_keys.anthropic is set: the runs use that key, billed per token at the
#      API price of ai.code_quality.model (a self_improvement run is a few dollars on a Fable
#      model, about half of that on an Opus one; every report of a run on the key ends with
#      a note saying so and what the run cost). The CLI is never run interactively, so no
#      login and no workspace-trust prompt stands in the way.
#   2. Optional: a claude.ai subscription (Pro/Max) instead of the key — open a terminal ON the
#      server machine, run `claude` and complete /login. Do not log in over SSH — a login made
#      in an SSH session is not seen by the server process. A login takes precedence over the key.
#   3. For the PRs: the GitHub CLI logged in on the server machine, any GitHub account —
#      `brew install gh` (on Linux `sudo apt install gh`), then `gh auth login` in a terminal there.
#      An account without write access to the repository opens its PRs from a fork of its own, made on its first PR. report_issue
#      files the issue through the same login; without one it drafts the issue and sends it with a
#      link, for the user to file by hand. self_analysis needs neither.
#   4. Optional: a mail account (imap.accounts): the nightly report is mailed from the account send_email uses to its own address.
# A build runs Claude Code and the test suite beside the server: a machine with less than 8 GB of memory
# (swap counted) may run out, which ends the build and can restart the server. Enabling the integration
# and starting a build each say so on such a machine; nothing is refused.
# The health check runs `claude auth status` (a free local call) every 15 minutes, first ~10 s
# after start; a missing CLI, or one with neither a login nor the key, shows as the error in
# list_integrations.
# The model the runs use is ai.code_quality.model: a Fable model (the default) or an Opus one, and
# claude-opus-5-5 is the one to switch to when the account has no usage for Fable or Fable costs too
# much. A smaller model (Sonnet, Haiku) writes no code here: config_set does not take one, and a
# config.yaml that names one has its runs on claude-opus-5-5.
self_improvement:
  # merge_strategy: rebase   # what the nightly auto-merge passes to `gh pr merge`: rebase (default), squash or merge
  # auto_merge_authors: [your-github-login]   # whose test-only PRs the nightly auto-merge may merge; default: the account `gh` is logged in as. PRs from forks are never merged
  nightly_runs: false   # true: the nightly run fires at 03:00 — bug analysis of the day's commits, triage of the last 24 hours of the server's logs (the problems that actually happened, minus those a commit has fixed since), a PR fixing the critical and major items of both fix lists (never auto-merged — it touches code), test generation, test health (flaky tests and tests over 100 ms are fixed or removed), then the auto-merge of test-only PRs, one email; a night without recent commits runs only the log triage, the fix and the auto-merge; false: only the self_analysis / self_improvement commands use Claude Code. Read at each fire, no restart needed. On an API key a night is four to five Claude Code runs, budget a few dollars a night on a Fable model
