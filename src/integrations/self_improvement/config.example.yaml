# The "Self Improvement" integration: Keep analysing and changing its own code through the
# Claude Code CLI on the server machine — self_analysis, improve_integration (a PR confined to one
# integration, or a new one), report_issue (a GitHub issue for the developers), self_improvement
# (a PR on any part of the code, developer installs only: the root key is_developer) and the
# nightly code-quality runs. Enable with `enabled_integrations: [Self Improvement]`.
# The setup is on the server machine itself, by hand:
#   1. Install Claude Code: `curl -fsSL https://claude.ai/install.sh | bash` (puts `claude` in
#      ~/.local/bin, which the server also looks in when it is not on the PATH). Nothing else is
#      needed when api_keys.anthropic is set: the runs use that key, billed per token at the
#      API price of ai.code_quality.model (a self_improvement run is a few dollars on a Fable
#      model, well under a dollar on a Sonnet one). The CLI is never run interactively, so no
#      login and no workspace-trust prompt stands in the way.
#      While the key stands in for a login the health check says so once in the chats (a
#      system note), so a logged-out CLI is noticed before the bill, not on it.
#   2. Optional: a claude.ai subscription (Pro/Max) instead of the key — open a terminal ON the
#      server machine, run `claude` and complete /login. Do not log in over SSH — a login made
#      in an SSH session is not seen by the server process. A login takes precedence over the key.
#   3. For the PRs and the issues: the GitHub CLI logged in with an account that has write access
#      to the repository — `gh auth login` in a terminal on the server machine. self_analysis
#      works without it.
#   4. Optional: a mail account (imap.accounts): the nightly report is mailed from the account send_email uses to its own address.
# The health check runs `claude auth status` (a free local call) every 15 minutes, first ~10 s
# after start; a missing CLI, or one with neither a login nor the key, shows as the error in
# list_integrations. The model the runs use is ai.code_quality.model.
self_improvement:
  # merge_strategy: rebase   # what the nightly auto-merge passes to `gh pr merge`: rebase (default), squash or merge
  # auto_merge_authors: [your-github-login]   # whose test-only PRs the nightly auto-merge may merge; default: the account `gh` is logged in as. PRs from forks are never merged
  nightly_runs: false   # true: the nightly run fires at 03:00 — bug analysis, test generation, test health (flaky tests and tests over 100 ms are fixed or removed), then the auto-merge of test-only PRs, one email; a night without recent commits only auto-merges; false: only the self_analysis / self_improvement commands use Claude Code. Read at each fire, no restart needed. On an API key a night is three Claude Code runs, budget a few dollars a night on a Fable model
