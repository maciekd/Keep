# Home Assistant as the house (plans/HOME_ASSISTANT_PLAN.md); enable with `enabled_integrations: [Home Assistant]`.
# One websocket to the server carries the state, the commands and the event feed.
#
# Running HA beside Keep — tips:
# - HA in Docker or OrbStack on a Mac: --network=host is the VM's network, not the Mac's, so mDNS/zeroconf
#   discovery never finds anything — add devices by IP. Run the container with --restart unless-stopped so it
#   comes back after a reboot.
# - Set internal_url and external_url in HA (Settings → System → Network), e.g. to a Tailscale MagicDNS name;
#   otherwise the HA phone app and its push notifications fail away from home. `url` below is Keep's own and
#   may be the same address.
# - Yes/No push notifications are HA's own: an automation calls notify.mobile_app_<device> with data.actions
#   and the answer comes back as a mobile_app_notification_action event. Keep neither sends these nor sees
#   the event (it follows state changes only) — let the automation act on it, or set an input_boolean Keep
#   can read. On iOS the buttons show when the notification is long-pressed.
# - Watch sensors in HA, not in Keep: "when sensor X crosses Y, do Z" is an HA automation. Asking Keep to
#   watch it means a full model round on every check.
home_assistant:
  url: http://homeassistant.local:8123   # the base URL of the server, http or https; the websocket path is derived
  token: YOUR_HOME_ASSISTANT_LONG_LIVED_TOKEN  # Profile → Security → Long-lived access tokens; an admin user's token also gets the registry events and who acted
  # true: only what Assist sees (Settings → Voice assistants → Expose) — your choice per entity, else HA's default:
  #   lights, switches, covers, fans, climate, media players and scenes, door/window/motion/presence/lock binary
  #   sensors and temperature/humidity/air-quality sensors; not locks, other sensors, input helpers, persons,
  #   scripts or automations (expose those there), never a hidden or disabled entity, nothing new when
  #   "expose new entities" is off.
  # false: every light, switch, fan, cover, lock, sensor, binary sensor, climate, media player, weather, input
  #   helper, person, scene, script, button and automation.
  # Either way a hidden or disabled entity never reaches Keep, nor do other domains (cameras, device trackers,
  # updates, …). On top of that the assistant keeps the owner's own rules (the home_assistant toolkit:
  # exclude_entities / include_entities by entity id, glob or domain) in memory/home_assistant_entity_rules.txt —
  # an include rule shows an entity whatever HA hides and whatever this key says.
  exposed_only: true
  # The domains whose state changes go into the dialog history as events — the feed is narrower than the house
  # data. Unset, it is the automations, scenes, scripts and persons: what the house did and who came and went,
  # the way a narrated automation log reads, and a lamp someone switches by hand is no event. Add light,
  # switch, fan, cover, lock, binary_sensor or the input_* helpers to hear about those too; [] or false is a
  # silent feed. A sensor, climate, media_player or weather entity is never an event (it would be a row per reading);
  # an entity the house data does not show (hidden, excluded, not exposed) is no event whatever its domain.
  feed_domains: [automation, scene, script, person]
  # Lines containing any of these strings are dropped from the HOME AUTOMATION DATA prompt section
  prompt_filters: []
