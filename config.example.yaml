chat:
  approval_timeout_seconds: 60  # seconds to wait for an Approve/Deny answer on sensitive commands (e.g. send_imessage) in any chat interface
  secret_request_timeout_seconds: 3600  # seconds to wait for a value after vault_request / config_request opened a masked prompt; long because the user often has to look the value up or set something up first

# Looking for the user's own Telegram messages ("read my Telegram")?
# That is the "Telegram Feed" integration, section telegram_feed — not this one.
# This section is the Telegram bot users chat with Keep through. It is an interface
# (interfaces.telegram, on by default) that list_integrations shows as "Telegram": without a
# bot_token it is listed as not configured. Setup is bot_token via config_request, then
# restart_integration("Telegram") — no server restart. Its switch is interfaces.telegram.enabled,
# not enabled_integrations. The bot reads the chat-id lists live: a change to them is in force
# at the next message, no restart — only bot_token and link_previews need restart_integration.
telegram_bot:
  bot_token: YOUR_TELEGRAM_BOT_TOKEN_HERE
  allowed_chat_ids: []  # empty = anyone may talk to the bot; /start in the bot shows a chat id. Read live, no restart.
  notify_chat_ids: []  # who gets the proactive pushes (autonomous findings, system notes, photos it sends unasked); empty = every allowed chat. A photo someone asked for goes back to their chat. Read live, no restart.
  link_previews: false  # true = Telegram renders preview cards for URLs in the bot's replies; needs restart_integration("Telegram")

# >> telegram_feed: src/integrations/telegram_feed/config.example.yaml

# >> imessage: src/integrations/imessage/config.example.yaml

# Feeds: integrations that pour into the history (iMessage, the personal Telegram feed). A feed
# that has never run catches up this many months back; one that was merely stopped resumes where
# it left off. Moving a horizon further back re-reads from there (the history dedupes).
feeds:
  imessage: { backfill_months: 60 }   # five years; chat.db rows are cheap
  telegram_feed: { backfill_months: 1 }
  photos: { backfill_months: 1, backfill_batch: false }   # one LLM call per photo or video, on the ai.photo_indexing tier (Gemini 3.8 Flash by default)
  # On a fresh install the first-run pipeline raises photos to 36 once the first memory bank is curated
  # (plans/FTUE_PIPELINE_PLAN.md); a wider value set by hand is left alone.
  # backfill_batch: true sends the stills of a catch-up fetch through the provider's batch API — every
  # token at half price, but Gemini's only promise is an answer within 24 h, and a job has sat unanswered
  # for the whole 30 min wait while the console showed nothing indexed. false (the default) indexes
  # everything live, within seconds per photo. New photos always go live.

# Which interfaces the server starts (floxy_ai_server.py). A disabled interface's module
# is never imported: with voice off, no audio/Whisper/torch/spaCy library is loaded. The
# startup check (RequirementsChecker) still verifies requirements-voice.txt, so the assistant
# can enable voice from the chat (config_set) and the next restart just works. Read at startup only.
interfaces:
  http:     { enabled: true }               # always on (the others register routes on it); port from argv
  voice:    { enabled: false }              # VoiceToVoice, off unless set to true; needs mics and speakers on the server, an ElevenLabs API key and api_keys.gemini (the ai.fast tier).
  telegram: { enabled: true }               # the bot + Notifier; also needs telegram_bot.bot_token
  console:  { enabled: true, port: 5151 }   # TUI dashboard (tui.py connects to this port)

# Server-internal microphone outposts: one virtual outpost per connected mic,
# transcribed locally with Whisper (MLX, Apple Silicon only). They push text to
# /stream exactly like remote Android/iOS outposts and join the same voting.
# On by default whenever the voice interface runs; set false for a server that only
# serves phone outposts. Without a mic or MLX they log an error and stay off.
local_outposts:
  enabled: true
  model_repo: "mlx-community/whisper-large-v3-turbo"  # the default
  exclude_mics: []          # name substrings (case-insensitive) of mics to skip, e.g. ["Bose QC45"] keeps
                            # earphones out; add one with config_set("local_outposts.exclude_mics[0]", "Bose QC45")
                            # (the ambient-noise volume monitor skips them too, even when one is the default input)
  # location: Kitchen       # the room the server's mics are in, reported with every query; unset = unknown location
  auto_recovery: true       # restart a mic whose audio stream stalls
  usb_power_cycle: true     # power-cycle the USB port as the last recovery step

vault:                      # secrets the LLM never sees — the console's Vault tab (VAULT_PLAN.md)
  key: CHANGE_ME            # passphrase that encrypts vault.bin. Lose it and the vault is lost; change it and the
                            # existing vault.bin can no longer be opened. Unset = vault disabled.
  default_country_code: 46  # a phone number written with a leading 0 is filed under this country code

# >> reminders: src/integrations/reminders/config.example.yaml

# Web search (Serper) tuning. Optional — these are the defaults.
#search:
#  country_hint: se          # gl parameter: country to bias results towards
#  interface_language: en    # hl parameter
#  results_limit: 6          # 1-10 results per query

# Display name of the household owner. Used as the `user` of requests that carry no
# sender identity of their own (TUI chat, Telegram messages without a sender name).
owner_name: YOUR_NAME

# Which line of the code restart_server follows. false: the `release` branch, what ./release.sh
# last published. true: `master`, the development line — every commit, straight away. The
# restart checks that branch out before pulling, so flipping this and restarting switches the
# install; the assistant may set it itself (config_set).
developer_release: false

# The nightly update: at 03:00 — after the nightly code-quality run when self_improvement.nightly_runs
# is on — the server checks out the branch developer_release names, pulls it and restarts if that
# left it on other code than it is running. No new commits, no restart. false: the code only
# changes on a restart_server. Read at each fire, no restart needed.
nightly_update: true

# Beta usage telemetry (assistant/Telemetry.py). An install is known by `id` alone, a random
# value the server writes here on its first start; the events are one per user turn, one per
# assistant turn (with the names of the commands it ran, never their arguments), one per
# integration switched on or off, one per TUI tab opened, the size of the memory (word and item
# counts) after a curation, the number of indexed photos and messages and the size of the prompt
# in KB, section by section (when any of it changes, at most hourly) and a daily heartbeat. For the install's first seven days (dated by first_run.json)
# the turns carry the query and the reply in full; after that they go out without their text.
# Vault values go out as their placeholders. `enabled: false` turns all of it off, from the next
# event on (no restart).
telemetry:
  enabled: true
  id:                   # written by the server

# Home automation extras, whichever backends are enabled — several at once make one house. Optional.
# home:
#   night_variable: Night     # the variable / input_boolean that is true while the house sleeps (default "Night")
#   # Devices that are always switched together, swapped for the scene that does the same —
#   # it keeps the response cache to one entry however the LLM spells the request.
#   command_consolidation:
#     - devices: ["Table Lamp (Kitchen)", "Spots (Kitchen)"]
#       on_scene: LightTheKitchenUp
#       off_scene: TurnOffKitchenLights

# Sonos zone name -> the room name the LLM sees; a blank value hides the zone. Optional.
# sonos:
#   room_mapping:
#     "Kitchen Front": Kitchen
#     "Kitchen Back": ""

# The location stamped on requests from the Android app, which sends none of its own. Optional.
# clients:
#   android_location: Kitchen

# Toolkits put in the LLM's window before every request from a channel, replacing the
# channel's default (VoiceToVoice: [home, music, tesla, weather]). Optional. A toolkit whose
# integration is off is skipped by itself. The `voice` toolkit (the spoken dialog style) is
# always loaded for VoiceToVoice and is not part of this list.
# preload_toolkits:
#   VoiceToVoice: [home, music]   # a household that never asks about the car or the weather

# The AI's name and spoken wake word — drives both the prompt identity ("You are <wake_word>")
# and the wake word served to outposts via /outpost_settings.
wake_word: Michelle
# Extra spellings the STT commonly mishears the wake word as (matched case-insensitively
# in addition to wake_word) so local outposts still trigger on near-misses. Optional.
wake_word_aliases: [michel]
# Words (or short phrases) the Scribe verifier renders a cleanly spoken wake word as
# ("Mission complete" for "Michelle good night", "We shall volume down" for "Michelle volume
# down"). They never trigger on their own; they only stop Scribe from vetoing a Whisper
# wake-word fire it merely misspelt. Optional — defaults to [mission, missions, we shall],
# which are renderings of "Michelle": set it explicitly (or to []) for any other wake_word.
wake_word_near_misses: [mission, missions, we shall]

# Ollama server used by every OllamaLLM tier. Optional — defaults to localhost.
# An explicit base_url passed to OllamaLLM's constructor still wins over this.
# When base_url points at a remote host, the KV-cache diagnostics (which parse
# Ollama's debug log) are read over ssh — set up key-based ssh access to that host.
# local_only is the one-line switch between cloud and local AI: true routes every `ai:` tier
# (except code_quality, the Claude Code CLI) to this server on OllamaLLM's default model,
# qwen3.8:27b-mlx, whatever the `ai:` block says; a tier that already names OllamaLLM keeps its
# `model:`. Videos are then left undescribed (Ollama has no video input). Takes effect on restart.
#ollama:
#  local_only: false
#  base_url: http://192.168.1.50:11434
#  ssh_host: user@192.168.1.50    # Optional ssh target for remote log reads; defaults to the base_url hostname
#  remote_log_path: /Users/user/Documents/Keep/log/ollama.log  # Optional; defaults to this repo layout
#  background_idle_seconds: 20    # Photo indexing on Ollama runs only after this much quiet since the last
#                                 # chat request or pre-heat; a user request arriving mid-image aborts the image

# Where the //FP and //TP debug commands collect the latest conversations' audio as labelled
# false/true wake-word positives. Optional — defaults to cache/stt_samples/{false-positive,en}.
#debug:
#  false_positive_dir: ~/stt-corpus/false-positive
#  true_positive_dir: ~/stt-corpus/en

# LLM backend selection. Optional — if omitted entirely, defaults to the cloud setup
# (ollama.local_only above flips the whole block to Ollama without editing it).
# Uncomment / edit to override per tier, e.g. to run everything on a local Ollama:
#ai:
#  fast:
#    llm: OllamaLLM          # Class name from assistant/llm/ (OllamaLLM, ClaudeLLM, GeminiLLM, ChatGPTLLM, GrokLLM, OpenRouterLLM)
#    # model: qwen3.8:27b-mlx   # Optional: override the LLM's default model
#  smart:
#    llm: OllamaLLM
#    # model: qwen3.8:27b-mlx
#  video:                   # describes video clips from iMessage / Telegram / email. Needs an LLM with native
#    llm: GeminiLLM         # video input — Gemini is the only backend that has one; Claude/ChatGPT/Ollama
#    # model: gemini-3.8-flash   # cannot take video and videos are then left undescribed ("[Video]")
#    # max_size_mb: 200     # larger clips are left undescribed; clips over 19 MB go through the Gemini Files API
#  autonomous_action:
#    llm: OllamaLLM
#  memory_curator:
#    llm: OllamaLLM
#    # batch: false           # the nightly run goes through Anthropic's batch API (half price, the answer
#    # batch_wait_minutes: 90 # minutes to an hour later); false, or no answer within the wait → the ordinary call
#  cache_auditor:
#    llm: OllamaLLM
#  photo_indexing:         # indexes Apple Photos stills and videos, one call each (thousands on a backfill).
#    llm: GeminiLLM         # Needs native video input for the videos, so Gemini is the only full backend
#    # model: gemini-3.8-flash
#  code_quality:            # model for the nightly Claude Code CLI runs (CodeQualityMaintainer)
#    model: claude-fable-5-1

language: en-US         # drives TTS synthesis language for every engine that accepts a hint
                        # (Gemini uses the full tag, Grok/Supertonic use the primary subtag, e.g. "sv").
                        # May be a single tag (above) or a list to listen for several languages:
                        #   language: [en-US, sv-SE]
                        # The first entry is the primary/default. With >1 language the local Whisper
                        # outposts auto-detect per utterance, reply + voice follow the spoken language,
                        # and speech in any other language is ignored. Use full locales (Gemini TTS
                        # wants e.g. sv-SE, not bare sv).

tts:
  # Names the LLM addresses people by. A listed name loses the comma before it (", Sam" is
  # spoken as " Sam": the pause sounds wrong); a pronunciation is how a name is spelled for
  # the engine, and tts.<engine>.name_pronunciations overrides it for one engine. Optional.
  # names: [sam, emma]
  # name_pronunciations: { siobhan: shivawn }
  # cartesia:
  #   voice: 829ccd10-f8b3-43cd-b8a0-4aeaa81f3b30   # every engine takes `voice`: elevenlabs, cartesia, grok, gemini, chirp3
  #   name_pronunciations: { siobhan: "<<ʃ|ɪ|v|ɔ|n>>" }
  # elevenlabs:
  #   model: eleven_v4_turbo            # v3/v4 models stream over the text-to-dialogue socket; eleven_flash_v2_5 and older over stream-input
  #   voice: QtY3JBOUKEB5xzrRfOKc         # daytime voice
  #   night_voice: geVuXdUpU0lgUukWJCUE   # the whispering voice of night, morning and late evening (house speakers only; the apps keep the daytime voice)
  fish:
    model: s2.1-pro-free # free through 2026-08-31; also: s2.1-pro, s2-pro, s1
    reference_id: YOUR_FISH_AUDIO_VOICE_REFERENCE_ID  # voice id from the fish.audio voice library
  supertonic:
    voice: M1            # voice style name; see Supertone/supertonic on HuggingFace for the full list
    first_chunk_steps: 5 # diffusion steps for the opener — fewer = lower first-audio latency
    total_steps: 10      # 5-12, diffusion steps for subsequent (batched) chunks — higher = better prosody
    speed: 1.0           # 0.7-2.0
