    latitude: 34.67448641
    longitude: 15.90048623
    # IANA timezone for everything rendered in local time (weather, calendar, photo dates).
    # Optional: left out, it is looked up from the coordinates above (a few seconds, once per
    # start), and without coordinates it is the server's own timezone.
    # timezone: Europe/Stockholm

