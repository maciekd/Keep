# Example configuration for the Keep AI server

# This file doubles as the assistant's documentation of every setting. So the notes
# on what a setting does, where its value comes from and what depends on what are written for the
# AI as much as for a human. Keep this file current whenever a setting is added or changed.
# An integration's own section lives in its folder, src/integrations/<name>/config.example.yaml: a line
# `# >> section: path` stands where it belongs, and config_help(section) shows the section whole.

# Every integration is off until it is listed here (Web Access and ElevenLabs TTS are on regardless).
# Use the names list_integrations shows: Arlo, Aseko Pool, CalDAV, Google, Google Docs, iCloud, IMAP Mail, iMessage, Indigo,
# Microsoft 365, Philips Hue, Photos, Plejd, Reminders, Ring, Self Improvement, Sonos & Spotify, Telegram Feed, Tesla, X, YR Weather.
# The TTS engines voice speaks through are integrations too — ElevenLabs TTS (on by default), Gemini TTS,
# Chirp 3 HD, Cartesia Sonic TTS, Fish Audio TTS, Grok TTS, Supertonic TTS: a request speaks through the
# first enabled and configured one, Swedish preferring Gemini TTS, so a Swedish install enables Gemini TTS
# (needs google_service_account) and a different English engine means enabling it and disabling
# ElevenLabs TTS. The assistant's enable_integration / disable_integration edit this list.
enabled_integrations: []

# Directories outside the checkout holding this install's own integration folders, laid out like
# src/integrations/: ~/KeepLocal/schoolsoft/ is found by listing ~/KeepLocal. Each folder has the same
# pieces as one of the repository's (<Name>Integration.py, toolkit.md, config.example.yaml, requirements.txt …)
# and is enabled the same way, by its name in enabled_integrations; a pull never touches it. A folder named
# like one of the repository's is left out. Read at start: a change needs restart_server. The assistant works on
# these folders with improve_local_integration (in place, no pull request: they are this install's own).
extra_integration_dirs: []

api_keys:
  openai: YOUR_OPENAI_API_KEY_HERE
  anthropic: YOUR_ANTHROPIC_API_KEY_HERE
  # Only for a key whose Scope is Organization - Anthropic then answers every request with
  # "anthropic-workspace-id is required": the id of the workspace to use (wrkspc_..., the ID column at
  # https://platform.claude.com/settings/workspaces). A key with Scope Default workspace needs nothing here.
  anthropic_workspace: ""
  anthropic_admin: YOUR_ANTHROPIC_ADMIN_API_KEY_HERE  # For cost monitoring, create at console.anthropic.com > Settings > Admin Keys. Note that cost comes in with a days delay.
  gemini: YOUR_GEMINI_API_KEY_HERE  # voice replies run on the ai.fast tier (Gemini by default): no key, no voice answers; also photos/video processing
  elevenlabs: YOUR_ELEVENLABS_API_KEY_HERE
  grok: YOUR_GROK_API_KEY_HERE
  openrouter: YOUR_API_KEY_HERE
  serper: YOUR_SERPER_API_KEY_HERE  # Get from https://serper.dev
  google_maps: YOUR_GOOGLE_MAPS_API_KEY_HERE
  cartesia: YOUR_CARTESIA_API_KEY_HERE
  fish_audio: YOUR_FISH_AUDIO_API_KEY_HERE  # https://fish.audio -> API keys
  # Sonos & Spotify: an app of your own at https://developer.spotify.com/dashboard (Web API). Its client id and
  # secret are all search and playback need. To start the playlists of your own Spotify library (own and followed)
  # by name, add the redirect URI http://127.0.0.1:8888/callback to the app and sign the account in once from any
  # chat with spotify_login() (the assistant hands you a link; paste the whole address the browser lands on back as
  # spotify_login_code("...")). The token lands in cache/oauth/spotify.json and survives restarts. The newest 10
  # playlists are in the prompt. Spotify-made playlists (Discover Weekly, Release Radar, Daily Mix) are not: since
  # November 2024 Spotify leaves them out for an app in development mode — add one as a Sonos favorite instead.
  spotify:
    client_id: YOUR_SPOTIFY_CLIENT_ID_HERE
    client_secret: YOUR_SPOTIFY_CLIENT_SECRET_HERE

google_service_account:
  type: service_account
  project_id: YOUR_PROJECT_ID
  private_key_id: YOUR_PRIVATE_KEY_ID
  private_key: "-----BEGIN PRIVATE KEY-----\nYOUR_PRIVATE_KEY\n-----END PRIVATE KEY-----\n"
  client_email: YOUR_CLIENT_EMAIL@YOUR_PROJECT_ID.iam.gserviceaccount.com
  client_id: YOUR_CLIENT_ID
  auth_uri: https://accounts.google.com/o/oauth2/auth
  token_uri: https://oauth2.googleapis.com/token
  auth_provider_x509_cert_url: https://www.googleapis.com/oauth2/v1/certs
  client_x509_cert_url: https://www.googleapis.com/robot/v1/metadata/x509/YOUR_CLIENT_EMAIL

