chat:
  approval_timeout_seconds: 300  # seconds to wait for an Approve/Deny answer on sensitive commands (e.g. send_imessage) in any chat interface; a card is withdrawn early if a newer message supersedes the request it belongs to
  secret_request_timeout_seconds: 3600  # seconds to wait for a value after vault_request / config_request opened a masked prompt; long because the user often has to look the value up or set something up first

# Looking for the user's own Telegram messages ("read my Telegram")?
# That is the "Telegram Feed" integration, section telegram_feed — not this one.
# This section is the Telegram bot users chat with Keep through. It is an interface
# (interfaces.telegram, on by default) that list_integrations shows as "Telegram Chat": without a
# bot_token it is listed as not configured. Setup is bot_token via config_request, then
# restart_integration("Telegram Chat") — no server restart. Its switch is interfaces.telegram.enabled,
# not enabled_integrations. The bot reads the chat-id lists live: a change to them is in force
# at the next message, no restart — only bot_token and link_previews need restart_integration.
telegram_bot:
  bot_token: YOUR_TELEGRAM_BOT_TOKEN_HERE
  # Positive ids are people (a private chat's id is the person's user id) — the household's owners, who may
  # run commands and answer approval cards. Negative ids are groups the bot was added to: there it answers
  # replies to its own messages, and — through the Telegram Feed, the owner's own account — anyone who
  # says its wake_word; a group member who is not a positive id is a guest, whose turn runs no command.
  # What is the owners' alone never goes to a group: the approval cards and secret prompts a group turn
  # needs, and the proactive pushes by default, go to the positive ids. An empty list serves no group at all.
  allowed_chat_ids: []  # empty = anyone may talk to the bot; /start in the bot shows a chat id. Read live, no restart.
  notify_chat_ids: []  # who gets the proactive pushes (autonomous findings, system notes, photos it sends unasked); empty = every allowed chat. A photo someone asked for goes back to their chat. Read live, no restart.
  link_previews: false  # true = Telegram renders preview cards for URLs in the bot's replies; needs restart_integration("Telegram Chat")

# Looking for the user's own iMessages ("read my messages", send_imessage)? That is the "iMessage Feed"
# integration, section imessage — not this one.
# This section is Keep as a contact of its own on iMessage: an Apple ID that belongs to the assistant,
# which the family texts like a friend and adds to group chats. It is an interface
# (interfaces.imessage, off by default) that list_integrations shows as "iMessage Chat".
# What it takes, in this order — ask the user for each step; most of it is done at a Mac, not in a chat:
# 1. An Apple ID for the assistant, never the user's own: a message sent to the user's own account is
#    the user's, read by the iMessage Feed integration. The user creates it (appleid.apple.com; Apple asks
#    for a phone number for its two-factor sign-in). An Apple ID with only an email address is enough
#    for iMessage: people text that address, and whoever writes by SMS (a phone without iMessage)
#    cannot reach it.
# 2. A macOS user whose Messages is signed in to iMessage with that Apple ID. One macOS user has one
#    Messages login, so the account lives in one of three places:
#    - Another macOS user on the server's Mac, with a Keep satellite in that user: host is
#      http://127.0.0.1:8898, never the Mac's name — such a satellite answers this Mac only. It runs only while that user is signed in — after a reboot somebody
#      signs that user in once; switching back to the own account afterwards is fine — and while that
#      user is switched away no typing dots are expected.
#    - Another Mac, with a Keep satellite there: host is the address its installer prints
#      (http://<that Mac's name>.local:8898), over plain HTTP, so only on a network the user trusts. A
#      Mac without a display is expected to work, typing dots included, but that has not been tried yet.
#    - The server's own macOS user, on a Mac that is the assistant's alone: host stays local and there is
#      no satellite. The user's own Messages is then elsewhere, so the iMessage Feed integration is off or
#      reads another Mac through a satellite of its own.
#    config_help("imessage_satellite") has the satellite's install: one command in Terminal at that Mac,
#    which ends by printing the two values for host and host_token below.
# 3. The grants, on the Mac and in the macOS user that hold the assistant's Messages, given at that
#    Mac's own screen: Full Disk Access for Terminal (to read the messages), Automation — macOS asks to
#    let Terminal control Messages at the first reply — and, for the typing dots only, Accessibility for
#    Terminal (below). With a satellite, show_full_disk_access_setting() and restart_server() act on the
#    wrong Mac and do not help; with host: local they are the way, as for the iMessage Feed integration.
# 4. host and host_token, typed by the user: config_request("imessage_chat.host") and
#    config_request("imessage_chat.host_token"). config_set refuses both; never state, guess or repeat
#    either value. With host: local there is nothing to type.
# 5. Who may text it: the three lists below, every entry typed by the user — one config_request per
#    entry ("imessage_chat.owners[0]", then [1] …; the same for guests and bots). config_set refuses
#    all three lists, so nothing the assistant reads can make somebody an owner, or put a stranger on a
#    list: whoever is listed is answered and is a post_message destination. Never state a handle; to
#    add or change a person, ask for the entry with config_request. A phone sends from its number or
#    from the Apple ID's email, whichever its Messages settings start new conversations from, and a
#    message from a handle that is not listed is never answered: ask an owner for both, one entry each
#    with the same name, and when a first message gets no answer, the other handle is the first thing
#    to check.
# 6. config_set("interfaces.imessage.enabled", "true") and restart_server — the interfaces are read at
#    startup. From then on restart_integration("iMessage Chat") is enough after a change of host or
#    host_token; the lists, daily_limit, typing_dots and listen_in_groups are read live. list_integrations shows what is
#    missing or wrong, with the fix.
# The account must be the chat's alone: while the iMessage Feed integration is enabled and imessage.host
# names the same account as imessage_chat.host, the chat does not start and list_integrations says so.
# Who may do what: an owner has every right the owner has in the console — commands run. What needs an
# approval or a typed secret is never shown in iMessage: it is asked in the console or the Telegram bot
# and the iMessage chat gets one line saying it is waiting (with neither of the two to ask in, the
# command does not run). An owner is an owner only over iMessage itself: the same number writing by
# SMS or RCS — an owner without an iPhone — is treated as a guest, since an SMS sender can be forged.
# A guest is answered, but no command runs for them and nothing private is shared. A sender on no list
# is never answered.
# Where it answers: a message in a 1:1 chat always. In a group chat it reads along: every message of a
# listed person is shown to it and it decides whether to answer — it stays quiet unless it is meant or
# can help, so nobody has to say its name. With listen_in_groups: false it is shown only a reply to one
# of its own messages, a message that says its name (wake_word, wake_word_aliases) and the message
# right after one of its own; whatever else the group says is then read as context with the next
# answer. Another assistant in a group (bots) always needs one of those three. There
# is no list of groups: a group is served through the listed people in it, each with the rights they
# have anywhere. Every person on the lists is a post_message destination by name. A group chat
# becomes one once an owner has written in it over iMessage — anybody can put a listed number in a
# group, so a listed member is not enough — and stops being one when that owner has left it, until an
# owner writes in it again. A group is called by its name without quotes and other marks, cut to 40
# characters, or by its listed members when that leaves nothing, the name is taken, two such groups
# have the same name, or the name is a listed person's.
# A message that waited more than 15 minutes for the server (a restart, a sleeping satellite) is not
# answered on its own; it is shown to the assistant with the next message of that chat. A guest who
# writes while another request is being worked on is answered once that is over.
# What does not work yet: it cannot send a photo or a video (the caption goes out as text). A picture
# sent to it is seen; any other file is only named to it. An edited or unsent message is not noticed.
# Typing dots: while it works on a reply the chat sees it typing, as with a person. That is optional
# and needs one more grant, on the Mac that holds the assistant's Messages (the satellite's Mac, not
# the server's, when host is a satellite) and in the macOS user Keep runs as there: Accessibility for
# Terminal — System Settings > Privacy & Security > Accessibility, turned on at that Mac's own screen;
# no restart, the next reply shows them. Tell the user what the grant is: it lets whatever is started
# from Terminal control that Mac. Keep then opens the chat in a small Messages window of its own on
# that Mac while it answers and closes it again. The dots show only while that user is the one logged
# in on the Mac's screen, the screen is unlocked and Messages is open with its main window: a Mac that
# locks its screen shows no dots (replies are sent all the same), so a Mac kept for the assistant
# should not lock (System Settings > Lock Screen). Only a chat among the dozen newest in the Messages
# sidebar gets them, and one the sidebar names unmistakably: a named group, a person by the contact
# card on that Mac or else by their number — not an unnamed group, not a name two chats share. While
# something on that Mac keeps the dots away list_integrations says what, as a warning on "iMessage
# Chat"; typing_dots: false ends dots and warning. tools/imessage_live_check/imessage_live_check.py,
# run by the user in Terminal at that Mac with their own number, shows whether the dots reach a phone.
imessage_chat:
  host: local                              # local = Messages on this Mac, under the user the server runs as.
                                           # For a satellite: http://<its address>:8898 (http://127.0.0.1:8898
                                           # for another user of this Mac). Typed by the user: config_request.
  host_token: YOUR_SATELLITE_TOKEN_HERE    # only with a satellite: imessage_satellite.token of its config.yaml.
                                           # A secret — config_request("imessage_chat.host_token").
  # owners, guests and bots have one entry per person and handle: a phone number with + and the country
  # code, or the email the person's iMessage uses. The name the assistant should call them may stand in
  # front — "Marcus +46701740605", "Charlotte charlotte@example.com" — and is optional: a bare handle
  # is served just the same and needs no re-entry. Somebody who writes from a phone number and an email
  # has two entries with the same name. A number without the leading + matches nobody. config_request on an index that is taken replaces that entry (the prompt
  # shows the user which one); the index after the last adds one. Removing an entry is a hand edit.
  owners: []                               # full rights, as in the console: commands run, approvals are asked in
                                           # the owner's other chats. Only over iMessage itself — the same number
                                           # writing by SMS is treated as a guest, since an SMS sender can be forged.
  guests: []                               # answered, but no command runs for them and nothing private is shared.
                                           # Typed by the user like owners: config_request.
  bots: []                                 # handles that are another household's assistant: guests that start a turn
                                           # at most 6 times an hour per chat, so two assistants cannot loop.
                                           # Typed by the user: config_request.
  daily_limit: 200                         # messages to one person or group per day; the rest of the day's replies
                                           # there are not sent (logged). Stops a loop from flooding a phone.
  typing_dots: true                        # show the chat that a reply is being typed (see above: needs Accessibility
                                           # for Terminal on the Mac that holds the account). false: never. Read at
                                           # every reply; without the grant nothing is touched and nothing shows.
  listen_in_groups: true                   # in a group chat every message of a listed person is shown to the
                                           # assistant, which answers only when it has a reason to (one LLM call
                                           # per message). false: only what is addressed to it (see above).

# >> telegram_feed: src/integrations/telegram_feed/config.example.yaml

# >> imessage: src/integrations/imessage/config.example.yaml

# >> whatsapp: src/integrations/whatsapp/config.example.yaml

# Feeds: integrations that pour into the history (iMessage, the personal Telegram feed). A feed
# that has never run catches up this many months back; one that was merely stopped resumes where
# it left off. Moving a horizon further back re-reads from there (the history dedupes); moving it
# forward changes nothing — rows are never dropped. A feed that can tell (Photos: its index table)
# also sweeps up, while live, whatever behind its cursor lost its row — a batch the provider
# refused, rows a migration forgot — so a half-done backfill always completes by itself.
feeds:
  imessage: { backfill_months: 60 }   # five years; chat.db rows are cheap
  telegram_feed: { backfill_months: 1 }
  # The edits of the Google Docs listed under google.accounts[].docs. poll_seconds is how often each doc's
  # modifiedTime is checked (one small call per doc; the export only runs when it moved) and how long a
  # doc has to be quiet before its session counts as over, so a row lands one to two intervals after the
  # last edit. Read live: a change is in force at the next poll.
  google_docs: { backfill_months: 1, poll_seconds: 600 }
  whatsapp: { backfill_months: 36 }    # read at linking time: the phone uploads that much history once, when the device links
  photos: { backfill_months: 1, backfill_batch: false }   # one LLM call per photo or video: new ones on the ai.photo_indexing tier (Sonnet), the backlog on ai.photo_backfill (Haiku), clips on ai.video
  # On a fresh install the first-run pipeline raises photos to 36 once the first memory bank is curated
  # (plans/FTUE_PIPELINE_PLAN.md); a wider value set by hand is left alone.
  # backfill_batch: true sends the stills of a catch-up fetch through the provider's batch API — every
  # token at half price, but Gemini's only promise is an answer within 24 h, and a job has sat unanswered
  # for the whole 30 min wait while the console showed nothing indexed. false (the default) indexes
  # everything live, within seconds per photo. New photos always go live.

# Which interfaces the server starts (floxy_ai_server.py). A disabled interface's module
# is never imported: with voice off, no audio/Whisper/torch/spaCy library is loaded. The
# startup check (RequirementsChecker) still verifies requirements-voice.txt, so the assistant
# can enable voice from the chat (config_set) and the next restart just works. Read at startup only.
interfaces:
  # false: the HTTP server and the TUI console answer only on this Mac. true: they answer the whole
  # network, which phones (the Keep app) and a TUI on another machine need — and so does anyone on the
  # Wi-Fi: there is no password, whoever reaches the address is the owner. Only on a network you trust.
  lan_access: false
  http:     { enabled: true }               # always on (the others register routes on it); port from argv
  voice:    { enabled: false }              # VoiceToVoice, off unless set to true; needs mics and speakers on the server, an ElevenLabs API key and api_keys.gemini (the ai.fast tier).
  telegram: { enabled: true }               # the bot + Notifier; also needs telegram_bot.bot_token
  imessage: { enabled: false }              # Keep as an iMessage contact of its own; needs the imessage_chat section
  console:  { enabled: true, port: 5151 }   # TUI dashboard (tui.py connects to this port)

# Server-internal microphone outposts: one virtual outpost per connected mic,
# transcribed locally with Whisper (MLX, Apple Silicon only). They push text to
# /stream exactly like remote Android/iOS outposts and join the same voting.
# On by default whenever the voice interface runs; set false for a server that only
# serves phone outposts. Without a mic or MLX they log an error and stay off.
local_outposts:
  enabled: true
  model_repo: "mlx-community/whisper-large-v3-turbo"  # the default
  exclude_mics: []          # name substrings (case-insensitive) of mics to skip, e.g. ["Bose QC45"] keeps
                            # earphones out; add one with config_set("local_outposts.exclude_mics[0]", "Bose QC45")
                            # (the ambient-noise volume monitor skips them too, even when one is the default input)
  # location: Kitchen       # the room the server's mics are in, reported with every query, and the name the
                            # server's speakers answer to in post_message (alias "speakers"), registered when
                            # the voice interface starts; unset = unknown location and the speakers are no destination
  auto_recovery: true       # restart a mic whose audio stream stalls
  usb_power_cycle: true     # power-cycle the USB port as the last recovery step

# System for automatic speaker identification
voice_discovery:
  enabled: true

vault:                      # secrets the LLM never sees — the console's Vault tab (VAULT_PLAN.md)
  key: CHANGE_ME            # passphrase that encrypts vault.bin. Lose it and the vault is lost; change it and the
                            # existing vault.bin can no longer be opened. Unset = vault disabled.
  default_country_code: 46  # a phone number written with a leading 0 is filed under this country code

# >> reminders: src/integrations/reminders/config.example.yaml

# Web search (Serper) tuning. Optional — these are the defaults.
#search:
#  country_hint: se          # gl parameter: country to bias results towards
#  interface_language: en    # hl parameter
#  results_limit: 6          # 1-10 results per query

# Display name of the household owner. Used as the `user` of requests that carry no
# sender identity of their own (TUI chat, Telegram messages without a sender name).
owner_name: YOUR_NAME

# Whether a message the assistant sends on the user's behalf — send_imessage, send_whatsapp and any
# channel that discloses it — ends with the "[Sent with the help of AI 🤖]" footer. false: the body
# goes out as written. Emails never carry it. Read at each send, no restart needed; the assistant
# flips it on request (config_set).
ai_message_footer: true

# Whether a chat request puts a preview of the user's query at the top of the system prompt. It
# nudges accuracy up, but it makes the prompt prefix this request's own: no later request reads
# what this one cached (Claude: every block then cached at the 5m tier; a local model rebuilds its
# KV cache every request), so it costs more and answers slower. auto: each model decides — on for
# the older Claude models, off for Fable, Opus 5.5 and Ollama. true / false: forced for every
# model. The FLOXY_PREPEND_USER_QUERY environment variable, when set, wins over this key. Read at
# each request, no restart needed.
prepend_user_query: auto

# Which line of the code restart_server follows. false: the `release` branch, what scripts/release.sh
# last published. true: `master`, the development line — every commit, straight away. The
# restart checks that branch out before pulling, so flipping this and restarting switches the
# install; the assistant may set it itself (config_set).
developer_release: false

# Whether this is a developer's install. true: the assistant is offered the self_improvement toolkit — a
# pull request on any part of the code base. false: it works through the developer toolkit alone —
# a PR confined to one integration (improve_integration) and GitHub issues for everything else
# (report_issue) — so the developers get issues and reviewable PRs instead of changes to the core.
# Read at each prompt build, no restart needed.
is_developer: false

# The nightly update: at 03:00, before the nightly code-quality run when self_improvement.nightly_runs
# is on, the server checks out the branch developer_release names, pulls it and restarts if that
# left it on other code than it is running. No new commits, no restart. false: the code only
# changes on a restart_server. Read at each fire, no restart needed.
nightly_update: true

# Relaunch the server when it dies. true: a launchd agent of your account opens "Keep Autostart.app"
# (the login item) every 5 minutes, and its script starts the server through start.sh unless one is
# up or starting — the same thing that happens at login, between logins too. false: a dead server
# stays down until the next login or a start by hand. Applied when set and at each start, no restart
# needed; the agent shows under System Settings > General > Login Items & Extensions, where it can
# be switched off. It tells nobody that the server died (issue #127 has the external heartbeat).
# An iMessage satellite (role below) reads the key too, at each start only — there is no assistant
# on it to set it — and its installer writes true: nobody sits at a satellite. ./stop.sh only stops;
# with the key on, launchd starts the process again within 5 minutes.
watchdog: false

# What this install runs. server (or no key): Keep itself, everything this file describes. imessage_satellite:
# no assistant at all — only a small HTTP service that lends the Messages account of this Mac user to a
# Keep server elsewhere, which names it under imessage.host or imessage_chat.host (section
# imessage_satellite below has the install). Not a key the assistant can change (config_set and
# config_request refuse it): the installer writes it on the Mac it is about. A satellite is an install of
# its own, in its own folder; a server's install is never turned into one.
# Read at start, by floxy_ai_server.py and by start.sh (scripts/role.sh), which both take anything but
# these two values for a mistake and start nothing.
role: server

# An iMessage satellite: what an install runs under `role: imessage_satellite` — the service that lends
# the Messages account of one Mac user to a Keep server. One is needed whenever the account is not that
# of the macOS user the server runs as: the user's own Messages on another Mac (section imessage), or the
# assistant's own Apple ID under another macOS user or on another Mac (section imessage_chat). Nothing
# here is read by a server, and none of it is the assistant's to set (config_set and config_request
# refuse the section): the installer writes it on the satellite's Mac. What to tell the user:
# 1. At the Mac, signed in as the macOS user whose Messages is signed in to iMessage with the Apple ID
#    to serve, open Terminal and run Keep's install command with the role in front of bash:
#      curl -fsSL https://raw.githubusercontent.com/maciekd/Keep/release/install.sh | KEEP_ROLE=imessage_satellite bash
#    It installs into that user's ~/Keep and asks for no API key. In a folder that already holds a Keep
#    server it stops and names the way out (KEEP_DIR=~/KeepSatellite in front of bash as well).
# 2. It asks one thing — where the Keep server runs: 1 for another user of the same Mac (the satellite
#    then answers that Mac only), 2 for another Mac (it answers the network; the token and the messages
#    cross it unencrypted, so only on a network the user trusts).
# 3. At its end it prints the address and the token, under both pairs of keys — imessage.host and
#    imessage.host_token, imessage_chat.host and imessage_chat.host_token — and starts the satellite:
#    Terminal shows the start and returns with "is up on port 8898". The token is shown nowhere else;
#    running the same command again upgrades the install and prints the lines again.
# 4. The grants, at that Mac's own screen and in that macOS user. Full Disk Access for Terminal: System
#    Settings > Privacy & Security > Full Disk Access, then quit Terminal, open it again and run
#    ~/Keep/start.sh (macOS applies the grant only to a relaunched Terminal). Automation: that start
#    reads Messages, and macOS then asks to let Terminal control System Events — allowing it makes the
#    satellite start at that user's login — and, at the first message sent, to let Terminal control
#    Messages. Accessibility for Terminal only for the typing dots of the iMessage chat (section
#    imessage_chat).
# 5. On the server the user types the two values: config_request for host and for host_token of the
#    section the account is for — never state or repeat them — then restart_integration("iMessage Feed") or
#    restart_integration("iMessage Chat"). list_integrations shows whether the satellite answers.
# From then on the satellite updates itself to the release line and version of the server that calls
# it, starts at that user's login and, since its installer writes watchdog: true, is started again by
# launchd within 5 minutes of dying. It has no console and no assistant: ~/Keep/start.sh shows its start
# and returns. A satellite under a second macOS user runs only while that user is signed in — after a
# reboot somebody signs that user in once. To stop one for good: watchdog: false in its config.yaml,
# ~/Keep/start.sh once, then ~/Keep/stop.sh. One satellite serves one Messages account; a second one on
# the same Mac is a second macOS user with an install of its own and another port.
#imessage_satellite:
#  port: 8898              # its own port, not the server's 8888: a second macOS user on the server's Mac shares
#                          # the port space
#  token: CHANGE_ME        # what the server must present with every call; at least 16 random characters (the
#                          # installer writes 32). Whoever holds it and reaches the port reads and sends this
#                          # account's messages — treat it like a password
#  lan_access: false       # false: only this Mac reaches the service (the satellite is another user of the
#                          # server's Mac). true: the whole network does, which a satellite on another Mac needs;
#                          # the token and the messages then cross the network unencrypted — only on a network you trust

# Ask before the assistant acts in its browser. true: a browser click, key press or script
# (browse_act, browse_key, browse_eval, browse_click_at) raises the same Approve/Deny card as
# sending an email, since it can submit a form on a site — one card per action, so a booking or a
# sign-up becomes a series of taps, and the autonomous check, which has nobody to ask, cannot act
# in the browser at all. false: the browser commands run like the read-only ones. Read at each
# command, no restart needed; the assistant may set it itself (config_set).
approve_guarded_commands: false

# Beta usage telemetry (assistant/Telemetry.py). An install is known by `id` alone, a random
# value install.sh writes here (the server, when it is missing on the first start); the events
# are the install itself (started, finished, or the step it failed in), one per user turn, one per
# assistant turn (with the names of the commands it ran, never their arguments), one per
# integration switched on or off, one per TUI tab opened, the size of the memory (word and item
# counts) after a curation, the number of indexed photos and messages and the size of the prompt
# in KB, section by section (when any of it changes, at most hourly) and a daily heartbeat. For the install's first seven days (dated by first_run.json)
# the turns carry the query and the reply in full; after that they go out without their text.
# Vault values go out as their placeholders. `enabled: false` turns all of it off, from the next
# event on (no restart).
telemetry:
  enabled: true
  id:                   # written by install.sh, or by the server when missing

# Home automation extras, whichever backends are enabled — several at once make one house. Optional.
# home:
#   night_variable: Night     # the variable / input_boolean that is true while the house sleeps (default "Night")
#   # Devices that are always switched together, swapped for the scene that does the same —
#   # it keeps the response cache to one entry however the LLM spells the request.
#   command_consolidation:
#     - devices: ["Table Lamp (Kitchen)", "Spots (Kitchen)"]
#       on_scene: LightTheKitchenUp
#       off_scene: TurnOffKitchenLights

# >> sonos: src/integrations/sonos/config.example.yaml

# >> heos: src/integrations/heos/config.example.yaml

# The location stamped on requests from the Android app, which sends none of its own. Optional.
# clients:
#   android_location: Kitchen

# Toolkits put in the LLM's window before every request from a channel, replacing the
# channel's default (VoiceToVoice: [home, music, cars, weather, timers]). Optional. A toolkit whose
# integration is off is skipped by itself. The `voice` toolkit (the spoken dialog style) is
# always loaded for VoiceToVoice and is not part of this list.
# preload_toolkits:
#   VoiceToVoice: [home, music]   # a household that never asks about the car or the weather

# The AI's name and spoken wake word — drives both the prompt identity ("You are <wake_word>")
# and the wake word served to outposts via /outpost_settings.
wake_word: Michelle
# Extra spellings the STT commonly mishears the wake word as (matched case-insensitively
# in addition to wake_word) so local outposts still trigger on near-misses. Optional.
wake_word_aliases: [michel]
# Words (or short phrases) the Scribe verifier renders a cleanly spoken wake word as
# ("Mission complete" for "Michelle good night", "We shall volume down" for "Michelle volume
# down"). They never trigger on their own; they only stop Scribe from vetoing a Whisper
# wake-word fire it merely misspelt. Optional — defaults to [mission, missions, we shall],
# which are renderings of "Michelle": set it explicitly (or to []) for any other wake_word.
wake_word_near_misses: [mission, missions, we shall]

# The one-line switch between cloud and local AI. none (the default): every `ai:` tier runs on
# the backend its block names, the cloud setup when it names none. ollama: every tier (except
# code_quality, the Claude Code CLI) runs on the Ollama server of the `ollama:` section below,
# on OllamaLLM's default model, qwen3.8:27b-mlx, whatever the `ai:` block says — a tier that
# already names OllamaLLM keeps its `model:`. ds4: the same on the ds4-server of the `ds4:`
# section. openai: the same on any OpenAI-compatible server — oMLX, llama.cpp — of the
# `openai_compatible:` section. Videos are then left undescribed (no local backend has video
# input). The assistant may flip it itself (config_set); takes effect on restart.
local_backend: none

# Ollama server used by every OllamaLLM tier. Optional — defaults to localhost.
# An explicit base_url passed to OllamaLLM's constructor still wins over this.
# When base_url points at a remote host, the KV-cache diagnostics (which parse
# Ollama's debug log) are read over ssh — set up key-based ssh access to that host.
#ollama:
#  base_url: http://192.168.1.50:11434
#  think: medium                  # Native thinking of a model that has it: low / medium / high — the level
#                                 # passed to the model (qwen3.8 takes them; medium, the default, scored best
#                                 # on the prompt test suite) —, true for the model's own level (a model that
#                                 # takes no levels needs this), or false — off, the prompt's <thinking>
#                                 # instruction applies instead.
#  ssh_host: user@192.168.1.50    # Optional ssh target for remote log reads; defaults to the base_url hostname
#  remote_log_path: /Users/user/Documents/Keep/log/ollama.log  # Optional; defaults to this repo layout
#  background_idle_seconds: 20    # Photo indexing on Ollama runs only after this much quiet since the last
#                                 # chat request or pre-heat; a user request arriving mid-image aborts the image

# ds4-server (antirez's DwarfStar engine, github.com/antirez/ds4) used by every Ds4LLM tier: one
# large open-weight model (DeepSeek V4.1 Flash by default; GLM 5.3 and Qwen3.8 Flash Next also run)
# resident on this machine's GPU, served OpenAI-style on localhost — start it with `scripts/local_ds4_start.sh`
# (the ds4 checkout beside this repository; it runs `./ds4-server --ctx 32768 --kv-disk-dir
# ~/.ds4/server-kv --kv-disk-space-mb 65536` and waits until the API answers). The disk KV
# cache keeps the prompt prefixes across tiers, the autonomous check and restarts: without it every
# switch between two prompts prefills the whole prompt again, ~12 s for 16k tokens instead of 0.2 s
# (the Ds4LLM docstring has the measurements). The assistant then writes its commands in DeepSeek's DSML call syntax
# (the server parses them). Optional — defaults to the
# server's default address and DeepSeek V4.1 Flash. No API key.
#ds4:
#  base_url: http://127.0.0.1:8000/v1
#  model: deepseek-v4.1-flash      # The id `GET /v1/models` on the server lists; an `ai:` tier's `model:` wins
#  reasoning_effort: low           # How much the model reasons before a conversation turn: none, minimal, low,
#                                  # medium, high, xhigh or max. The autonomous check gets one step more (medium
#                                  # at least); the memory curator always gets high.
#  log_path: ~/Documents/ds4/ds4-server.log   # The file the server's output is redirected to: the chat's
#                                  # "Prefilling…" bar reads the prefill progress from it. Optional.
#  ssh_host: user@192.168.1.50     # Where to read that log over ssh when base_url is another machine;
#                                  # defaults to the base_url host. Optional.
#  background_idle_seconds: 20     # Photo indexing on ds4 runs only after this much quiet since the last
#                                  # chat request; a user request arriving mid-image aborts the image
#  kv_disk_dir: ~/.ds4/server-kv   # The server's --kv-disk-dir, when the server runs on this machine: an entry
#  kv_disk_max_age_hours: 24       # nothing has used for this long is deleted (checked hourly), since the server
#                                  # itself evicts by hits, never by age, and a full cache evicts the fresh
#                                  # entries first. 0 turns the sweep off.

# Any OpenAI-compatible local server used by every OpenAICompatibleLLM tier: oMLX (github.com/jundot/omlx)
# or llama.cpp's server, say, serving one model on this machine or another on the LAN. The
# chat's "Prefilling…" bar, the rate beside it and the cache report come from the progress the
# server streams while it prefills (llama.cpp's `return_progress`, which oMLX speaks too), so
# nothing but the address is needed. Optional — defaults to localhost:8000 and the first model
# the server lists.
#openai_compatible:
#  base_url: http://127.0.0.1:8000/v1
#  model: qwen3-27b                # An id or alias `GET /v1/models` on the server lists; unset, the first one it
#                                  # lists. An `ai:` tier's `model:` wins. A model called qwen… writes its commands
#                                  # in Qwen's syntax, any other in Keep's own (a tier's `command_format:` overrides).
#  api_key: ""                     # Only for a server that wants one; most local servers take none.
#  reasoning_effort: low           # How much the model reasons before a conversation turn: none, minimal, low,
#                                  # medium, high, xhigh or max. The autonomous check gets one step more (medium
#                                  # at least); the memory curator always gets high.
#  return_progress: true           # Ask the server to stream its prefill progress (the bar's source). Set false
#                                  # for a server that rejects the key; the bar then runs on a time estimate.
#  background_idle_seconds: 20     # Photo indexing runs only after this much quiet since the last chat request;
#                                  # a user request arriving mid-image aborts the image

# Where the //FP and //TP debug commands collect the latest conversations' audio as labelled
# false/true wake-word positives. Optional — defaults to cache/stt_samples/{false-positive,en}.
#debug:
#  false_positive_dir: ~/stt-corpus/false-positive
#  true_positive_dir: ~/stt-corpus/en

# LLM backend selection. Optional — if omitted entirely, defaults to the cloud setup
# (local_backend above flips the whole block to Ollama or ds4 without editing it).
# Uncomment / edit to override per tier, e.g. to run everything on a local Ollama:
#ai:
#  fast:
#    llm: OllamaLLM          # Class name from assistant/llm/ (OllamaLLM, Ds4LLM, OpenAICompatibleLLM, ClaudeLLM, GeminiLLM, ChatGPTLLM, GrokLLM, OpenRouterLLM)
#    # model: qwen3.8:27b-mlx   # Optional: override the LLM's default model
#  smart:
#    llm: OllamaLLM
#    # model: qwen3.8:27b-mlx
#    # llm: Ds4LLM             # or a local ds4-server (the `ds4:` section above); the model is the one it loaded
#    # llm: OpenAICompatibleLLM  # or any OpenAI-compatible local server (the `openai_compatible:` section above)
#    # command_format: qwen   # Optional, any tier: the syntax the model writes its commands in — `keep` (Keep's own
#                           # call text, what GPT, Gemini and Ds4LLM use), `qwen` (the <tool_call> block Qwen was
#                           # trained on, OllamaLLM's own choice), `dsml` (DeepSeek's block, which ds4 parses) or
#                           # `invoke` (the <function_calls>/<invoke> block Claude was trained to write tool
#                           # calls in; a Claude tier reads one it writes anyway, whatever the format). Unset,
#                           # the LLM class decides — Keep's own for Claude, GPT, Gemini and ds4, Qwen's for
#                           # Ollama and for a Qwen model on an OpenAI-compatible server; set it for an Ollama
#                           # model that is not a Qwen, or to try a syntax
#                           # (`invoke` on a Claude tier, say). The smart tier's
#                           # format is the one every reply is parsed in and the prompt's command texts are
#                           # rendered in; a name no format has is logged and ignored.
#  video:                   # describes video clips from iMessage / Telegram / email. Needs an LLM with native
#    llm: GeminiLLM         # video input — Gemini is the only backend that has one; Claude/ChatGPT/Ollama
#    # model: gemini-3.8-flash   # cannot take video and videos are then left undescribed ("[Video]")
#    # max_size_mb: 200     # larger clips are left undescribed; clips over 19 MB go through the Gemini Files API
#  autonomous_action:
#    llm: OllamaLLM
#  memory_curator:
#    llm: OllamaLLM
#    # batch: false           # the nightly run goes through Anthropic's batch API (half price, the answer
#    # batch_wait_minutes: 90 # minutes to an hour later); false, or no answer within the wait → the ordinary call
#    # tips_destination: "Our Keeps"   # where the nightly run posts tips for other households' Keeps: a
#                           # post_message destination — the title (or the id as text) of a Telegram group the bot
#                           # is in and that is on telegram_bot.allowed_chat_ids. The curator goes over the period
#                           # for what another Keep would want to know (a site, a service, a device, Keep itself)
#                           # and posts each as "Tip from <owner>'s Keep: …", never the household's own people,
#                           # places or accounts. The other Keeps read the group through their owners' Telegram
#                           # Feed. Unset: no tips are posted.
#  cache_auditor:
#    llm: OllamaLLM
#  photo_indexing:         # describes each new Apple Photos still as it arrives, one call each — a few a day,
#    llm: ClaudeLLM         # so the model that describes best for the money (Sonnet 5.5). A Claude model takes
#    # model: claude-sonnet-5-5   # stills only: the clips go to the `video` tier's backend (Gemini) when it has a
#                           # key, and stay unindexed otherwise. Sonnet, Opus and Fable refuse to be asked for
#                           # their reasoning, so the indexer drops the prompt's "thinking" field for them itself.
#  photo_backfill:         # the backlog — thousands of stills on a first run, the sweep behind the cursor and a
#    llm: ClaudeLLM         # bulk run from the console; nobody waits for it, so the cheapest model that describes
#    # model: claude-haiku-5-5    # well (Haiku 5.5). GeminiLLM / gemini-3.8-flash on either tier indexes its
#                           # videos natively, no `video` tier needed.
#  code_quality:            # model for the nightly Claude Code CLI runs (CodeQualityMaintainer)
#    model: claude-fable-5-2

language: en-US         # drives TTS synthesis language for every engine that accepts a hint
                        # (Gemini uses the full tag, Grok/Supertonic use the primary subtag, e.g. "sv").
                        # May be a single tag (above) or a list to listen for several languages:
                        #   language: [en-US, sv-SE]
                        # The first entry is the primary/default. With >1 language the local Whisper
                        # outposts auto-detect per utterance, reply + voice follow the spoken language,
                        # and speech in any other language is ignored. Use full locales (Gemini TTS
                        # wants e.g. sv-SE, not bare sv).

tts:
  # Emotion tags: the LLM directs the voice with audio tags ([laughs], [whispers], [sarcastic]) and the
  # engine performs them. Needs an engine that can (ElevenLabs v3/v4, Cartesia, Gemini, Fish); off, the
  # LLM is not told about tags and any it writes are stripped before synthesis. Optional, default false.
  emotions: false
  # Names the LLM addresses people by. A listed name loses the comma before it (", Sam" is
  # spoken as " Sam": the pause sounds wrong); a pronunciation is how a name is spelled for
  # the engine, and tts.<engine>.name_pronunciations overrides it for one engine. Optional.
  # names: [sam, emma]
  # name_pronunciations: { siobhan: shivawn }
  # cartesia:
  #   voice: 829ccd10-f8b3-43cd-b8a0-4aeaa81f3b30   # every engine takes `voice`: elevenlabs, cartesia, grok, gemini, chirp3
  #   name_pronunciations: { siobhan: "<<ʃ|ɪ|v|ɔ|n>>" }
  # elevenlabs:
  #   model: eleven_v4_turbo            # v3/v4 models stream over the text-to-dialogue socket; eleven_flash_v2_5 and older over stream-input
  #   voice: QtY3JBOUKEB5xzrRfOKc         # daytime voice
  #   night_voice: geVuXdUpU0lgUukWJCUE   # the whispering voice of night, morning and late evening (house speakers only; the apps keep the daytime voice)
  fish:
    model: s2.1-pro-free # free through 2026-08-31; also: s2.1-pro, s2-pro, s1
    reference_id: YOUR_FISH_AUDIO_VOICE_REFERENCE_ID  # voice id from the fish.audio voice library
  supertonic:
    voice: M1            # voice style name; see Supertone/supertonic on HuggingFace for the full list
    first_chunk_steps: 5 # diffusion steps for the opener — fewer = lower first-audio latency
    total_steps: 10      # 5-12, diffusion steps for subsequent (batched) chunks — higher = better prosody
    speed: 1.0           # 0.7-2.0
