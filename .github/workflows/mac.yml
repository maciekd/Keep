# The unit suite on macOS, Apple Silicon — the proof that a Mac which is not the development machine
# runs the server's code: a clean runner has only what the requirements files bring, and it runs what
# the Ubuntu jobs leave out (the pins marked darwin, the tests that need them, the scripts over the
# Mac's own bash and tools). The install is the one install.sh runs on a Mac: the voice file, which
# includes the base one, with no Homebrew package beside it.
name: Mac

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      FLOXY_CONFIG: config.example.yaml
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            src/integrations/*/requirements.txt
      - name: An arm64 Python, as install.sh asks for
        run: python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"
      - name: Requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-voice.txt
      - name: The pins marked darwin are in
        run: python -c "import objc, sounddevice, mlx_whisper, silero_vad, lingua"
      - name: Unit tests
        run: python -m pytest tests/unit --override-ini="log_cli=false" -q --tb=short
